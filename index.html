<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banners of the Realm</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
<header class="topbar">
  <div class="brand"><span class="crest">⚜</span><h1>Banners of the Realm</h1></div>
  <div class="season" id="seasonBadge"></div>
  <div class="topbtns">
    <button class="btn small" id="btnLink" hidden title="Play-by-link codes">🔗 Link</button>
    <button class="btn small" id="btnMute" aria-pressed="false" title="Mute">🔊</button>
    <button class="btn small" id="btnHelp">How to Play</button>
    <button class="btn small" id="btnNew">New Game</button>
  </div>
</header>
<div class="resbar" id="resbar"></div>

<main class="layout">
  <section class="mapwrap" id="mapwrap">
    <div class="maphead" id="maphead"></div>
    <div class="mapstage" id="mapstage">
      <svg id="map" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Map of the realm"></svg>
      <svg id="anim" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
      <div class="zoombtns"><button class="btn tiny" id="zoomIn" aria-label="Zoom in">＋</button><button class="btn tiny" id="zoomOut" aria-label="Zoom out">－</button><button class="btn tiny" id="zoomReset" aria-label="Reset zoom">⌂</button><span class="muted" id="zoomlvl">100%</span></div>
      <div id="cardlayer" class="cardlayer" aria-live="polite"></div>
    </div>
    <div class="legend">
      <span>Shield = army power · tap a county to act · drag/pinch to pan &amp; zoom</span>
      <span>🌫 grey mist = fog of war</span><span>👁 scouted</span><span>🏰 castle · red ring = siege</span><span>⚜ capital</span>
    </div>
  </section>
  <aside class="side">
    <section class="panel" id="countyPanel"></section>
    <section class="panel" id="ordersPanel"></section>
    <section class="panel" id="logPanel">
      <div class="panelhead"><h2>Chronicle</h2><button class="btn tiny" id="btnSkip" hidden>Skip ⏩</button></div>
      <div id="log" class="log" aria-live="polite"></div>
    </section>
  </aside>
</main>
<div class="sealbar" id="sealbar"></div>
</div>

<div class="pass" id="pass" hidden></div>
<div class="modal" id="modal" hidden><div class="modalbox" id="modalbox"></div></div>

<script src="art/manifest.js"></script>
<script src="engine.js"></script>
<script src="net.js"></script>
<script src="ui.js"></script>
</body>
</html>
